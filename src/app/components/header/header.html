<nav class="navbar navbar-expand-md bg-body-tertiary shadow-sm">
  <div class="container">

    <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2">
      <i class="fa-solid fa-plane"></i>
      <span>Skyline</span>
    </a>


    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
            <i class="fa-solid fa-house me-1"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/catalogue" routerLinkActive="active" class="nav-link">
            <i class="fa-solid fa-plane-departure me-1"></i>Buscar vuelos
          </a>
        </li>
        @if (isAdmin()) {
          <li class="nav-item">
            <a routerLink="/admin" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-user-shield me-1"></i>Administración
            </a>
          </li>
        }
        @if (isAirlineUser()) {
          <li class="nav-item">
            <a routerLink="/airline" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-building me-1"></i>Mi aerolínea
            </a>
          </li>
        }
      </ul>

      <div class="d-flex gap-2">
        @if (isLoggedIn()) {
          <button class="btn btn-outline-danger btn-sm" (click)="closeSession()">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn btn-outline-primary btn-sm">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Ingresar
          </a>
          <a routerLink="/register" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-user-plus me-1"></i>Registrarse
          </a>
        }
      </div>
    </div>
  </div>
</nav>
